            "@type": "Question",
            "name": "FIRE 達成後的每月提領額是如何計算的？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "自您指定的 FIRE 年份起，每年初將自剩餘總資產中提領 4% 作為全年生活費。將其除以 12 即可得出名目每月提領額，並同步扣除通膨折現為今日購買力的實質每月提領額。"
            }
          },
          {
            "@type": "Question",
            "name": "實質資產與名目資產有何不同？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "名目資產是帳戶上的數字；實質資產則是扣除通膨後的真實購買力價值。"
            }
          },
          {
            "@type": "Question",
            "name": "儲蓄與支出階段如何計入複利？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "階段金額以今日購買力為準，程式會隨年份自動計入通膨調整。為反映全年持續發生的金流，採用年中複利折算公式 flow * sqrt(1 + r) 計算。"
            }
          },
          {
            "@type": "Question",
            "name": "我輸入的財務資料會被儲存至伺服器嗎？",
