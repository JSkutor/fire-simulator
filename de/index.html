            "@type": "Question",
            "name": "Ist dieser Simulator ein historischer Backtest-Rechner?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nein. Statt vergangene Börsenzyklen statistisch auszuwerten, berechnet dieses Tool einen deterministischen Vorwärts-Cashflow über 40 Jahre basierend auf Ihren persönlichen Rendite-, Spar- und Inflationsannahmen."

            "@type": "Question",
            "name": "Wie wird der monatliche Entnahmebetrag berechnet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ab dem gewählten FIRE-Jahr werden zu Jahresbeginn 4% des Depotbestands für Lebenshaltungskosten entnommen. Geteilt durch 12 ergibt sich der monatliche Nominalbetrag sowie der inflationsbereinigte reale Wert."
            }
          },
          {
            "@type": "Question",
            "name": "Was ist der Unterschied zwischen realem und nominalem Vermögen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nominal ist der reine Ziffernbetrag auf dem Konto. Real ist der inflationsbereinigte Wert, der zeigt, was Sie sich im Vergleich zu heute tatsächlich leisten können."
            }
          },
          {
            "@type": "Question",
            "name": "Wie werden Spar- und Ausgabephasen verzinst?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Die Phasen-Beträge werden jährlich um die Inflation erhöht. Für die unterjährige Verzinsung kontinuierlicher Zahlungsströme nutzt der Simulator die Formel flow * sqrt(1 + r)."
            }
          },
          {
            "@type": "Question",
            "name": "Werden meine Finanzdaten auf Servern gespeichert?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nein. Alle Berechnungen laufen zu 100% lokal in Ihrem Browser."
            }
          }
        ]
      }
