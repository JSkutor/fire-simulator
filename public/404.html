<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found — FIRE Simulator</title>
    <script>
      // Preserve language path for SPA routing
      sessionStorage.redirect = location.href;
      var isKo = location.pathname.indexOf('/ko') !== -1;
      var base = location.origin + '/';
      location.replace(isKo ? base + 'ko/' : base);
    </script>
  </head>
  <body>
    <p>Page not found. <a href="/">Go to Home</a></p>
  </body>
</html>
