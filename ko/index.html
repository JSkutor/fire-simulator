        "mainEntity": [
          {

            "name": "이 시뮬레이터는 트리니티 연구 기반의 백테스팅 도구인가요?",

            }
          },
          {
            "@type": "Question",
            "name": "FIRE 시점 이후 월 인출액은 어떻게 계산되나요?",
            "acceptedAnswer": {

            }
          },
          {
            "@type": "Question",
            "name": "실질 자산과 명목 자산은 어떻게 계산되나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "명목 자산은 입력하신 연간 수익률로 매년 복리 성장합니다. 실질 자산은 여기에 장기 물가상승률(한국 2.3%)을 반영하여 '실질 = 명목 ÷ (1 + 인플레이션)^년차' 공식으로 현재 구매력 가치로 할인 환산됩니다."
            }
          },
          {
            "@type": "Question",
            "name": "저축 및 지출 구간(Periods)은 복리에 어떻게 반영되나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "저축/지출 구간에 입력한 금액은 '현재 가치' 기준입니다. 시뮬레이션에서는 매년 물가상승률을 감안하여 실제 납입/지출 금액이 점진적으로 증액되는 것으로 계산되며, 연중 발생하는 현금흐름을 반영하기 위해 flow * sqrt(1 + r) 중간점 복리 공식을 적용합니다. 여러 구간이 겹칠 경우 자동으로 합산됩니다."
            }
          },
