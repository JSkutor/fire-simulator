    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Es este simulador una herramienta de backtesting histórico?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Es un simulador de flujo de caja hacia adelante a 40 años que calcula el crecimiento patrimonial y la renta mensual según tus propios parámetros de rentabilidad e inflación."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo se calcula el retiro mensual tras el hito FIRE?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A partir del año FIRE seleccionado, se retira el 4% del saldo patrimonial a principios de año para gastos. Se divide entre 12 para obtener la renta mensual nominal y real."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuál es la diferencia entre patrimonio real y nominal?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "El nominal es la cifra monetaria en cuenta; el real descuenta la inflación para mostrar lo que verdaderamente puedes comprar en precios de hoy."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo se capitalizan las fases de ahorro y gasto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Los importes se actualizan con la inflación cada año. Para flujos continuos se aplica la fórmula flujo * sqrt(1 + r)."
            }
          },
          {
            "@type": "Question",
            "name": "¿Se guardan mis datos financieros en algún servidor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. El 100% de los cálculos y datos se ejecutan localmente en tu navegador."
            }
          }
        ]
      }
