    <!-- JSON-LD Structured Data: FAQPage (Google Rich Snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is the 4% withdrawal rate safe for an early retirement lasting 40+ years?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The original Trinity Study evaluated 30-year horizons with a 95% success rate. For longer horizons (40-50+ years typical of early FIRE), adopting a Dynamic Withdrawal rule where withdrawals adjust to annual portfolio balance significantly reduces ruin risk compared to a fixed-dollar rule."
            }
          },
          {
            "@type": "Question",
            "name": "How does the simulator calculate Real vs. Nominal wealth?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nominal wealth compounds each year at your selected Annual Return rate. Real wealth discounts this nominal sum by the long-term inflation rate (2.0% for USD) using the formula: Real = Nominal / (1 + inflation)^year to show today's true purchasing power."
            }
          },
          {
            "@type": "Question",
            "name": "How are savings and spending periods calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each row in the Savings & Spending Periods table represents annual contributions (positive) or living expenses (negative) in today's dollars, which are inflation-adjusted over time."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between Fixed 4% and Dynamic 4% withdrawal?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In a Fixed 4% strategy, you withdraw 4% on year 1 and inflate that dollar amount. In Dynamic 4% withdrawal (used here), you withdraw 4% of whatever portfolio balance you currently hold each year, naturally cushioning bear markets."
            }
          },
          {
            "@type": "Question",
            "name": "Is my personal financial information stored on your servers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. 100% of all calculations, inputs, and simulations run entirely client-side in your web browser. We do not store, track, or collect your financial data on any server."
            }
          }
        ]
      }
    </script>
