    <!-- JSON-LD FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Ce simulateur est-il un simple outil de backtest historique ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non. C'est un simulateur de flux de trésorerie sur 40 ans qui projette votre patrimoine et votre rente mensuelle en fonction de vos propres prévisions de rendement et d'inflation."
            }
          },
          {
            "@type": "Question",
            "name": "Comment est calculée la rente mensuelle après FIRE ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "À partir de l'année FIRE choisie, 4% du solde de début d'année est prélevé pour financer vos dépenses. Ce montant est divisé par 12 pour afficher la rente mensuelle brute et son équivalent en pouvoir d'achat réel."
            }
          },
          {
            "@type": "Question",
            "name": "Quelle est la différence entre patrimoine réel et nominal ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Le nominal est le montant chiffré sur votre compte ; le réel déduit l'inflation cumulée pour refléter ce que vous pourrez concrètement acheter en prix d'aujourd'hui."
            }
          },
          {
            "@type": "Question",
            "name": "Comment sont capitalisées les phases d'épargne et de dépenses ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Les montants sont ajustés chaque année selon l'inflation. Pour refléter des flux continus, le simulateur applique une capitalisation à mi-période flux * sqrt(1 + r)."
            }
          },
          {
            "@type": "Question",
            "name": "Mes données financières sont-elles envoyées sur un serveur ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolument pas. 100% des calculs s'exécutent localement dans votre navigateur web."
            }
          }
        ]
      }
    </script>
